<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тест: «Давай вспомним!» — Python Start</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef3f9; --card:#fff; --ink:#1e2a45; --muted:#7a869f; --line:#e3e9f2;
  --green:#12b886; --green-d:#0c9a70; --green-l:#e6f8f1;
  --yellow:#ffc53d; --yellow-l:#fff6dc; --purple:#7c4dff; --purple-l:#f1ebff;
  --red:#f03e3e; --red-l:#fff0f0; --blue:#3b82f6; --blue-l:#eaf2ff;
  --r:18px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
button{font-family:inherit;cursor:pointer}
.muted{color:var(--muted)}
.hidden{display:none!important}
.card{background:var(--card);border-radius:var(--r);box-shadow:0 2px 0 rgba(30,42,69,.04),0 8px 24px rgba(30,42,69,.06)}

/* ---------- header ---------- */
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 20px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.logo{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#20c997,#0ca678);display:grid;place-items:center;box-shadow:0 4px 12px rgba(18,184,134,.35)}
.brand-title{font-weight:900;font-size:21px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--green-d);background:var(--green-l);border:1px solid #b2ecd9;padding:3px 8px;border-radius:999px}
.brand-sub{font-size:12.5px;color:var(--muted)}
.stats{display:flex;align-items:center;gap:8px}
.xp{background:var(--yellow-l);border:1px solid #ffe08a;color:#8a5a00;font-weight:900;padding:8px 12px;border-radius:12px;white-space:nowrap}
.pill{border:1px solid var(--line);background:#fff;padding:8px 12px;border-radius:12px;font-weight:800;font-size:14px;color:var(--ink)}
.pill:hover{background:#f7f9fc}
.ico{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:12px;font-size:16px;display:grid;place-items:center;transition:.15s}
.ico:hover{background:#f7f9fc;transform:translateY(-1px)}
main{max-width:1400px;margin:0 auto;padding:18px 20px 40px}

/* ---------- quiz ---------- */
.quiz{overflow:hidden}
.q-head{display:flex;align-items:center;gap:14px;padding:16px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.q-num{width:40px;height:40px;border-radius:12px;background:var(--yellow-l);border:1px solid #ffe08a;color:#8a5a00;font-weight:900;display:grid;place-items:center;font-size:18px}
.q-label{font-weight:900;font-size:13px;letter-spacing:.05em}
.q-score{font-size:13px;color:var(--green-d);font-weight:700}
.q-dots{display:flex;gap:6px;margin:0 auto}
.q-dots i{width:22px;height:7px;border-radius:9px;background:#e4e9f2}
.q-dots i.cur{background:var(--yellow)} .q-dots i.ok{background:var(--green)} .q-dots i.bad{background:#ff8787}
.q-body{display:grid;grid-template-columns:1.1fr 1fr;min-height:430px}
.q-body.single-col{grid-template-columns:1fr}
.q-left{padding:26px 26px 30px}
.q-right{background:#f8fafd;border-left:1px solid var(--line);padding:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.q-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px}
.topic{background:var(--yellow-l);border:1px solid #ffe08a;color:#8a5a00;font-weight:800;padding:4px 10px;border-radius:999px}
.q-left h2{font-size:26px;margin:22px 0;line-height:1.25}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:2px solid var(--line);background:#fff;border-radius:16px;padding:16px;font-size:15.5px;font-weight:700;color:var(--ink);transition:.15s}
.opt:hover:not(:disabled){border-color:#b9c6dc;transform:translateY(-1px)}
.opt .let{flex:none;width:26px;height:26px;border-radius:50%;background:#eef2f8;color:#5b6784;display:grid;place-items:center;font-size:12px;font-weight:900}
.opt code{font-family:'JetBrains Mono',monospace;background:#eef2f8;padding:1px 6px;border-radius:6px;font-size:.92em}
.opt.ok{border-color:var(--green);background:var(--green-l)} .opt.ok .let{background:var(--green);color:#fff}
.opt.bad{border-color:#ff8787;background:var(--red-l)} .opt.bad .let{background:var(--red);color:#fff}
.opt:disabled{cursor:default}
.q-right h3{margin:12px 0 6px;font-size:20px}
.q-right p{margin:0 0 16px;color:#4b5774;line-height:1.5;max-width:380px}
.btn{border:0;border-radius:14px;padding:14px 22px;font-weight:900;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.15s}
.btn:active{transform:translateY(1px)}
.btn.green{background:linear-gradient(180deg,#20c997,#0ca678);color:#fff;box-shadow:0 4px 0 #087f5b}
.btn.green:hover{filter:brightness(1.05)}
.btn.white{background:#fff;color:var(--blue);border:2px solid #cfe0ff}
.btn.white:hover{background:var(--blue-l)}
.btn:disabled{opacity:.6;cursor:wait}
.small{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 12px;font-weight:800;font-size:13px;color:#4b5774;display:inline-flex;align-items:center;gap:6px}
.small:hover{background:#f7f9fc}
.hint-box{background:var(--yellow-l);border:1px solid #ffe08a;border-radius:12px;padding:14px;margin:12px 0;font-size:14.5px;text-align:left;display:none;color:#8a5a00;font-weight:700;line-height:1.5}
.hint-box.show{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.mascot{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.finish{padding:40px 26px;text-align:center}
.finish h2{font-size:30px;margin:12px 0 6px}
.finish .big{font-size:56px;font-weight:900;color:var(--green-d);margin:8px 0}

/* ---------- quiz types ---------- */
.match-container{display:grid;grid-template-columns:1fr 1.8fr;gap:20px;margin-top:20px}
.match-column{display:flex;flex-direction:column;gap:12px}
.match-column-title{font-weight:800;font-size:13px;color:var(--muted);letter-spacing:.05em;margin-bottom:4px}
.match-item{border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px 16px;font-weight:700;font-size:14px;line-height:1.4;cursor:pointer;transition:.15s;user-select:none}
.match-item:hover{border-color:#b9c6dc;transform:translateY(-1px)}
.match-item.selected{border-color:var(--blue);background:var(--blue-l);box-shadow:0 2px 8px rgba(59,130,246,.2)}
.match-item.connected{border-color:var(--green);background:var(--green-l)}
.match-item.wrong{border-color:#ff8787;background:var(--red-l)}
.match-item .match-letter{display:inline-block;width:24px;height:24px;border-radius:50%;background:var(--yellow-l);color:#8a5a00;font-weight:900;font-size:12px;text-align:center;line-height:24px;margin-right:8px}
.match-item.selected .match-letter{background:var(--blue);color:#fff}
.match-item.connected .match-letter{background:var(--green);color:#fff}
.match-item.wrong .match-letter{background:var(--red);color:#fff}

.multi-wrap{display:flex;flex-direction:column;gap:12px}
.multi-opt{display:flex;gap:12px;align-items:center;text-align:left;border:2px solid var(--line);background:#fff;border-radius:16px;padding:16px 18px;font-size:15.5px;font-weight:700;color:var(--ink);transition:.15s;cursor:pointer}
.multi-opt:hover{border-color:#b9c6dc;transform:translateY(-1px)}
.multi-opt .chk{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:#fff;display:grid;place-items:center;font-size:16px;font-weight:900;color:transparent;transition:.15s}
.multi-opt.selected{border-color:var(--blue);background:var(--blue-l)}
.multi-opt.selected .chk{background:var(--blue);border-color:var(--blue);color:#fff}
.multi-opt.ok{border-color:var(--green);background:var(--green-l)}
.multi-opt.ok .chk{background:var(--green);border-color:var(--green);color:#fff}
.multi-opt.bad{border-color:#ff8787;background:var(--red-l)}
.multi-opt.bad .chk{background:var(--red);border-color:var(--red);color:#fff}
.multi-opt.missed{border-color:var(--green);background:var(--green-l);opacity:.6}
.multi-opt.missed .chk{background:var(--green);border-color:var(--green);color:#fff}
.multi-check{margin-top:20px;text-align:center}

.emoji-wrap{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:20px}
.emoji-opt{width:90px;height:90px;border:3px solid var(--line);background:#fff;border-radius:20px;display:grid;place-items:center;font-size:48px;transition:.15s;cursor:pointer}
.emoji-opt:hover{border-color:#b9c6dc;transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.emoji-opt.selected{border-color:var(--green);background:var(--green-l);transform:scale(1.05)}
.emoji-opt:disabled{cursor:default}

/* ---------- modal & cert ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(20,30,50,.45);z-index:50;display:grid;place-items:center;padding:16px;backdrop-filter:blur(3px)}
.modal{background:#fff;border-radius:22px;max-width:640px;width:100%;padding:22px;max-height:92vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.2)}
.modal h3{margin:0 0 10px;font-size:22px}
.modal input{font-family:inherit;font-size:16px;border:2px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;margin:6px 0 12px;font-weight:700}
.cert{border:6px double var(--green);border-radius:18px;padding:26px 20px;text-align:center;background:linear-gradient(180deg,#f3fcf8,#fff)}
.cert .ct{font-size:13px;letter-spacing:.3em;color:var(--green-d);font-weight:900}
.cert h2{font-size:32px;margin:6px 0}
.cert .name{font-size:28px;font-weight:900;border-bottom:2px solid var(--yellow);display:inline-block;padding:4px 18px;margin:10px 0;min-width:200px;word-break:break-all}
.cert p{margin:6px 0;color:#4b5774}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}

@media (max-width:980px){
  .q-body{grid-template-columns:1fr}
  .q-right{border-left:0;border-top:1px solid var(--line)}
  .match-container{grid-template-columns:1fr}
}
@media (max-width:640px){
  main{padding:12px 12px 30px}
  .top{padding:10px 12px}
  .opts{grid-template-columns:1fr}
  .q-left h2{font-size:22px}
  .emoji-opt{width:70px;height:70px;font-size:36px}
}
@media print{
  body *{visibility:hidden}
  #certPrint,#certPrint *{visibility:visible}
  #certPrint{position:fixed;left:0;top:0;width:100%}
}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="logo"><svg width="34" height="34" viewBox="0 0 64 64"><ellipse cx="13" cy="44" rx="6" ry="4" fill="#b2f2bb"/><ellipse cx="47" cy="44" rx="6" ry="4" fill="#b2f2bb"/><circle cx="54" cy="30" r="7" fill="#b2f2bb"/><circle cx="56" cy="28" r="1.6" fill="#1e2a45"/><path d="M8 38c0-12 10-20 22-20s22 8 22 20z" fill="#fff"/><path d="M14 37c1-8 8-14 16-14s15 6 16 14z" fill="#d3f9d8"/><path d="M22 37l4-9h8l4 9" fill="none" stroke="#38d9a9" stroke-width="2.4" stroke-linejoin="round"/></svg></div>
    <div>
      <div class="brand-title">Тест: «Давай вспомним!» <span class="badge">ПОВТОРЕНИЕ</span></div>
      <div class="brand-sub">Python Start · Урок 2</div>
    </div>
  </div>
  <div class="stats">
    <div class="xp" title="Очки опыта">⭐ <span id="xp">0</span> XP</div>
    <button class="ico" id="soundBtn" title="Звук">🔊</button>
    <button class="ico" id="resetBtn" title="Начать заново">↺</button>
  </div>
</header>

<main>
  <section class="card quiz">
    <div class="q-head">
      <div class="q-num" id="qNum">1</div>
      <div>
        <div class="q-label" id="qLabel">ВОПРОС 1 ИЗ 6</div>
        <div class="q-score">Правильных ответов: <span id="qScore">0</span></div>
      </div>
      <div class="q-dots" id="qDots"></div>
    </div>
    <div id="qBody" class="q-body">
      <div class="q-left">
        <div class="q-top"><span class="topic" id="qTopic"></span><span class="muted" id="qHint"></span></div>
        <h2 id="qText"></h2>
        <div id="qOpts"></div>
      </div>
      <div class="q-right" id="qRight"></div>
    </div>
    <div id="qFinish" class="finish hidden"></div>
  </section>
</main>

<div class="modal-bg hidden" id="certModal">
  <div class="modal">
    <div id="certContent"></div>
  </div>
</div>
<canvas id="confetti"></canvas>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const QUIZ = [
  {
    type: 'emoji',
    topic: 'Настроение',
    q: 'Оцени свой настрой с помощью смайлика',
    hint: 'Просто кликни на тот смайлик, который больше всего подходит к твоему текущему настроению.',
    options: ['😎', '😔', '😴', '😡', '😍'],
    ok: [0, 4],
    ex: 'Отлично! Ты готов(а) к повторению материала! 🚀'
  },
  {
    type: 'matching',
    topic: 'Понятия',
    q: 'Соотнеси понятие с определением',
    hint: 'Сначала нажми на слово в левом столбце, а затем выбери его правильное значение в правом столбце.',
    left: ['Алгоритм', 'Язык Программирования', 'Программа'],
    right: [
      'Это алгоритм, записанный на языке программирования и готовый к выполнению компьютером.',
      'Это язык для общения с машинами, состоящий из строго определенных команд, каждая из которых имеет только одно значение (интерпретацию).',
      'Последовательность действий для достижения определенной цели или решения задачи.'
    ],
    ok: [2, 1, 0],
    ex: 'Алгоритм — это последовательность действий. Язык программирования — способ записать команды для компьютера. Программа — это алгоритм, записанный на языке программирования.'
  },
  {
    type: 'matching',
    topic: 'Правила Python',
    q: 'Соотнеси название правила с его значением',
    hint: 'Вспомни, как именно мы пишем команды в редакторе кода.',
    left: ['Правило Начала', 'Правило Порядка', 'Правила Оформления'],
    right: [
      'Python чувствителен к регистру (например, Print и print — разные вещи). Случайный лишний знак, пробел или запятая могут сломать программу.',
      'Первая команда программы (и не только) должна быть написана в самом начале строки. Начинать код с отступа можно только в особых случаях (например, внутри функций или циклов).',
      'Команды выполняются строго по порядку, сверху вниз, если они написаны ровно друг под другом. Компьютер — очень дисциплинированный исполнитель!'
    ],
    ok: [1, 2, 0],
    ex: 'Правило Начала — первая команда с начала строки. Правило Порядка — команды выполняются сверху вниз. Правила Оформления — Python чувствителен к регистру и лишним знакам.'
  },
  {
    type: 'single',
    topic: 'Функция print()',
    q: 'Что делает функция print()?',
    hint: 'Вспомни, что происходит в консоли, когда ты запускаешь код с этой командой.',
    options: [
      'Выводит информацию на экран.',
      'Считывает данные, которые вводит пользователь с клавиатуры.',
      'Рисует геометрические фигуры на холсте.',
      'Очищает экран от ранее написанного текста.'
    ],
    ok: 0,
    ex: 'Функция <code>print()</code> выводит информацию на экран. Это основная команда для отображения текста и результатов вычислений.'
  },
  {
    type: 'multi',
    topic: 'Содержимое print()',
    q: 'Что мы можем поместить внутрь скобок print()?',
    hint: 'Команда print() умеет работать с базовыми типами данных. Подумай, может ли она сама воспроизводить звук или показывать картинки?',
    options: [
      'Строки (Текст)',
      'Числа',
      'Выражения (Арифметические операции)',
      'Картинки и графические файлы',
      'Звуковые сигналы и музыку'
    ],
    ok: [0, 1, 2],
    ex: 'В <code>print()</code> можно помещать строки (текст в кавычках), числа и арифметические выражения. Картинки и звуки так напрямую вывести нельзя.'
  },
  {
    type: 'matching',
    topic: 'Команды turtle',
    q: 'Соотнесите название команды модуля turtle с её назначением',
    hint: 'Вспомни перевод английских слов: left (налево), right (направо), color (цвет).',
    left: ['forward(пиксели)', 'left(градусы)', 'right(градусы)', 'color(цвет)', 'exitonclick()', 'pensize(пиксели)', 'circle(радиус)'],
    right: [
      'Устанавливает новый цвет для линии, которую рисует черепашка.',
      'Перемещает черепашку вперёд на указанное число пикселей, оставляя след.',
      'Оставляет окно с рисунком открытым до тех пор, пока пользователь не кликнет на него.',
      'Поворачивает черепашку влево (против часовой стрелки) на заданный угол.',
      'Нарисовать круг с заданным радиусом в пикселях.',
      'Изменить размер пера, которым рисует исполнитель (изначально — 1).',
      'Поворачивает черепашку вправо (по часовой стрелке) на заданный угол.'
    ],
    ok: [1, 3, 6, 0, 2, 5, 4],
    ex: 'forward — вперёд, left — налево, right — направо, color — цвет, exitonclick — оставить окно, pensize — толщина пера, circle — круг.'
  }
];

const XP_CORRECT = 10;
const KEY = 'quiz_recall_v1';

function defaults(){ return {idx:0, answers:{}, xp:0, finished:false, xpGiven:{}, muted:false, name:''}; }
let state = defaults();
try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s) state = Object.assign(defaults(), s); } catch(e) {}
let saveTimer = 0;
function save(){ clearTimeout(saveTimer); saveTimer = setTimeout(()=>{ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {} }, 150); }

const MASCOT = (size = 64) => `<svg class="mascot" width="${size}" height="${size}" viewBox="0 0 64 64"><ellipse cx="13" cy="46" rx="6" ry="4" fill="#8ce99a"/><ellipse cx="47" cy="46" rx="6" ry="4" fill="#8ce99a"/><circle cx="53" cy="30" r="8" fill="#8ce99a"/><circle cx="55" cy="28" r="2" fill="#1e2a45"/><path d="M50 33q3 2 6 0" stroke="#1e2a45" stroke-width="1.5" fill="none" stroke-linecap="round"/><path d="M6 41c0-13 11-22 24-22s24 9 24 22z" fill="#20c997"/><path d="M13 40c1-8 8-14 17-14s16 6 17 14z" fill="#0ca678"/><path d="M22 40l4-8h8l4 8M30 26v6" fill="none" stroke="#63e6be" stroke-width="2.2" stroke-linejoin="round"/></svg>`;

/* --- Аудио --- */
let actx = null;
function beep(kind){
  if (state.muted) return;
  const seq = {good:[[523, .1], [659, .1], [784, .18]], bad:[[330, .12], [247, .2]], click:[[880, .04]]}[kind];
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    let t = actx.currentTime;
    seq.forEach(([f, d]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(kind === 'click' ? 0.05 : 0.14, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + d + 0.03); t += d * 0.85;
    });
  } catch (e) {}
}

function confetti(){
  const c = $('#confetti'), x = c.getContext('2d'); c.width = innerWidth; c.height = innerHeight;
  const cols = ['#20c997', '#ffc53d', '#7c4dff', '#ff6b6b', '#4dabf7', '#ff922b'];
  const ps = Array.from({length:150}, () => ({x:innerWidth / 2, y:innerHeight / 3, vx:(Math.random() - .5) * 16, vy:-Math.random() * 13 - 3, s:Math.random() * 8 + 5, c:cols[Math.floor(Math.random() * cols.length)], r:Math.random() * 6, vr:(Math.random() - .5) * .4}));
  let f = 0;
  (function tick(){
    x.clearRect(0, 0, c.width, c.height);
    ps.forEach(p => { p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); });
    if (++f < 170) requestAnimationFrame(tick); else x.clearRect(0, 0, c.width, c.height);
  })();
}

function quizScore(){
  let score = 0;
  QUIZ.forEach((q, i) => {
    const a = state.answers[i];
    if (a == null) return;
    score += isAnswerCorrect(q, a) ? 1 : 0;
  });
  return score;
}

function isAnswerCorrect(q, a){
  if (a == null) return false;
  if (q.type === 'single') return a === q.ok;
  if (q.type === 'multi') {
    const c = q.ok.slice().sort(), g = a.slice().sort();
    return c.length === g.length && c.every((v, j) => v === g[j]);
  }
  if (q.type === 'matching') {
    const c = q.ok.slice(), g = a.slice();
    return c.length === g.length && c.every((v, j) => v === g[j]);
  }
  if (q.type === 'emoji') return q.ok.includes(a);
  return false;
}

let matchState = {selectedLeft: null, connections: {}};
let multiState = {selected: []};

function renderQuiz(){
  const n = QUIZ.length;
  $('#qScore').textContent = quizScore();
  $('#qDots').innerHTML = QUIZ.map((q, i) => {
    const a = state.answers[i];
    let cls = '';
    if (a == null) cls = i === state.idx && !state.finished ? 'cur' : '';
    else cls = isAnswerCorrect(q, a) ? 'ok' : 'bad';
    return `<i class="${cls}"></i>`;
  }).join('');

  if (state.finished) {
    $('#qBody').classList.add('hidden');
    $('#qFinish').classList.remove('hidden');
    $('#qNum').textContent = '✓';
    $('#qLabel').textContent = 'ТЕСТ ПРОЙДЕН';
    const sc = quizScore();
    $('#qFinish').innerHTML = `${MASCOT(90)}<h2>${sc === n ? 'Идеально! Ты всё помнишь!' : sc >= n / 2 ? 'Хороший результат!' : 'Неплохое начало!'}</h2>
      <div class="big">${sc} / ${n}</div><p class="muted">правильных ответов</p>`;
    return;
  }

  $('#qBody').classList.remove('hidden');
  $('#qFinish').classList.add('hidden');
  const i = state.idx, q = QUIZ[i], a = state.answers[i];
  $('#qNum').textContent = i + 1;
  $('#qLabel').textContent = `ВОПРОС ${i + 1} ИЗ ${n}`;
  $('#qTopic').textContent = '❓ ' + q.topic;
  
  let sub = '';
  if (q.type === 'single') sub = 'Выбери один ответ';
  if (q.type === 'multi') sub = 'Выбери все верные варианты';
  if (q.type === 'matching') sub = 'Соедини пары';
  if (q.type === 'emoji') sub = 'Выбери смайлик';
  $('#qHint').textContent = sub;
  
  $('#qText').textContent = q.q;

  const optsDiv = $('#qOpts');
  optsDiv.innerHTML = '';
  const qRight = $('#qRight');
  const qBody = $('#qBody');

  if (q.type === 'emoji') {
    qBody.classList.add('single-col');
    qRight.classList.add('hidden');
  } else {
    qBody.classList.remove('single-col');
    qRight.classList.remove('hidden');
  }

  if (q.type === 'single') {
    optsDiv.className = 'opts';
    optsDiv.innerHTML = q.options.map((t, k) => {
      let cls = 'opt';
      if (a != null) {
        if (k === q.ok) cls += ' ok';
        else if (k === a) cls += ' bad';
      }
      return `<button class="${cls}" data-k="${k}" ${a != null ? 'disabled' : ''}><span class="let">${'ABCD'[k]}</span><span>${t}</span></button>`;
    }).join('');
    optsDiv.querySelectorAll('.opt').forEach(b => b.onclick = () => { beep('click'); answerSingle(+b.dataset.k); });

  } else if (q.type === 'multi') {
    optsDiv.className = 'multi-wrap';
    if (a == null) {
      multiState = {selected: []};
      const html = q.options.map((t, k) =>
        `<div class="multi-opt" data-k="${k}"><span class="chk"></span><span>${t}</span></div>`
      ).join('') + `<div class="multi-check"><button class="btn green" id="multiCheck" disabled>✔ Проверить ответ</button></div>`;
      optsDiv.innerHTML = html;
      optsDiv.querySelectorAll('.multi-opt').forEach(b => {
        b.onclick = () => toggleMulti(+b.dataset.k);
      });
      $('#multiCheck').onclick = () => { beep('click'); checkMulti(); };
    } else {
      const selected = a;
      optsDiv.innerHTML = q.options.map((t, k) => {
        let cls = 'multi-opt';
        if (q.ok.includes(k)) {
          cls += selected.includes(k) ? ' ok' : ' missed';
        } else if (selected.includes(k)) {
          cls += ' bad';
        }
        const mark = selected.includes(k) ? '✓' : (q.ok.includes(k) ? '✓' : '');
        return `<div class="${cls}"><span class="chk">${mark}</span><span>${t}</span></div>`;
      }).join('');
    }

  } else if (q.type === 'matching') {
    optsDiv.className = 'match-container';
    if (a != null) {
      const leftHtml = q.left.map((l, li) => {
        const isCorrect = a[li] === q.ok[li];
        const cls = isCorrect ? 'connected' : 'wrong';
        return `<div class="match-item ${cls}"><span class="match-letter">${String.fromCharCode(65 + a[li])}</span>${l}</div>`;
      }).join('');
      const rightHtml = q.right.map((r, ri) => {
        const connectedIdx = a.indexOf(ri);
        const isCorrect = connectedIdx >= 0 && a[connectedIdx] === q.ok[connectedIdx];
        const cls = connectedIdx >= 0 ? (isCorrect ? 'connected' : 'wrong') : '';
        return `<div class="match-item ${cls}"><span class="match-letter">${String.fromCharCode(65 + ri)}</span>${r}</div>`;
      }).join('');
      optsDiv.innerHTML = `<div class="match-column"><div class="match-column-title">ПОНЯТИЯ</div>${leftHtml}</div><div class="match-column"><div class="match-column-title">ОПРЕДЕЛЕНИЯ</div>${rightHtml}</div>`;
    } else {
      matchState = {selectedLeft: null, connections: {}};
      const leftHtml = q.left.map((l, li) => `<div class="match-item" data-type="left" data-idx="${li}">${l}</div>`).join('');
      const rightHtml = q.right.map((r, ri) => `<div class="match-item" data-type="right" data-idx="${ri}"><span class="match-letter">${String.fromCharCode(65 + ri)}</span>${r}</div>`).join('');
      optsDiv.innerHTML = `<div class="match-column"><div class="match-column-title">ПОНЯТИЯ</div>${leftHtml}</div><div class="match-column"><div class="match-column-title">ОПРЕДЕЛЕНИЯ</div>${rightHtml}</div>`;
      optsDiv.querySelectorAll('.match-item').forEach(item => {
        item.onclick = () => handleMatchClick(item);
      });
    }

  } else if (q.type === 'emoji') {
    optsDiv.className = 'emoji-wrap';
    optsDiv.innerHTML = q.options.map((e, k) => {
      let cls = 'emoji-opt';
      if (a === k) cls += ' selected';
      return `<div class="${cls}" data-k="${k}">${e}</div>`;
    }).join('');
    if (a == null) {
      optsDiv.querySelectorAll('.emoji-opt').forEach(b => b.onclick = () => { beep('click'); answerEmoji(+b.dataset.k); });
    }
  }

  if (q.type === 'emoji') return;

  if (a == null) {
    qRight.innerHTML = `${MASCOT(90)}
      <h3>Нажми на ответ</h3>
      <p class="muted">Здесь появится результат и объяснение</p>
      <button class="small" id="hintBtn" style="margin-top:10px">💡 Показать подсказку</button>
      <div id="hintBox" class="hint-box">${q.hint}</div>`;
      
    $('#hintBtn').onclick = () => {
      beep('click');
      $('#hintBox').classList.add('show');
      $('#hintBtn').classList.add('hidden');
    };
  } else {
    const correct = isAnswerCorrect(q, a);
    const xpText = state.xpGiven[i] === 'now' ? ` +${XP_CORRECT} XP` : '';
    qRight.innerHTML = `<div style="font-size:54px">${correct ? '🎉' : '🙈'}</div>
      <h3 style="color:${correct ? 'var(--green-d)' : 'var(--red)'}">${correct ? 'Правильно!' + xpText : 'Не совсем…'}</h3>
      <p>${q.ex}</p>
      <button class="btn green" id="qNext">${i + 1 < n ? 'Следующий вопрос →' : 'Завершить тест ✓'}</button>`;
    $('#qNext').onclick = () => {
      beep('click');
      if (i + 1 < n) state.idx++;
      else state.finished = true;
      save();
      renderQuiz();
    };
  }
}

function toggleMulti(k){
  beep('click');
  const idx = multiState.selected.indexOf(k);
  if (idx >= 0) multiState.selected.splice(idx, 1);
  else multiState.selected.push(k);
  document.querySelectorAll('.multi-opt').forEach(el => {
    const kk = +el.dataset.k;
    const sel = multiState.selected.includes(kk);
    el.classList.toggle('selected', sel);
    el.querySelector('.chk').textContent = sel ? '✓' : '';
  });
  const btn = $('#multiCheck');
  if (btn) btn.disabled = !multiState.selected.length;
}

function checkMulti(){
  const i = state.idx;
  if (!multiState.selected.length) return;
  state.answers[i] = multiState.selected.slice();
  const correct = isAnswerCorrect(QUIZ[i], state.answers[i]);
  if (correct) beep('good'); else beep('bad');
  if (correct && !state.xpGiven[i]) {
    state.xpGiven[i] = 'now';
    state.xp += XP_CORRECT;
    updateHeader();
    confetti();
  }
  save();
  renderQuiz();
}

function handleMatchClick(item){
  beep('click');
  const type = item.dataset.type;
  const idx = +item.dataset.idx;
  const q = QUIZ[state.idx];
  if (type === 'left') {
    document.querySelectorAll('.match-item[data-type="left"]').forEach(el => el.classList.remove('selected'));
    item.classList.add('selected');
    matchState.selectedLeft = idx;
  } else if (type === 'right' && matchState.selectedLeft !== null) {
    const leftIdx = matchState.selectedLeft;
    matchState.connections[leftIdx] = idx;
    document.querySelectorAll('.match-item[data-type="left"]').forEach(el => {
      const li = +el.dataset.idx;
      el.classList.remove('selected', 'connected');
      if (matchState.connections[li] !== undefined) el.classList.add('connected');
    });
    document.querySelectorAll('.match-item[data-type="right"]').forEach(el => {
      const ri = +el.dataset.idx;
      el.classList.remove('selected');
      if (Object.values(matchState.connections).includes(ri)) el.classList.add('connected');
    });
    matchState.selectedLeft = null;
    if (Object.keys(matchState.connections).length === q.left.length) {
      setTimeout(() => checkMatching(), 400); // Автопроверка
    }
  }
}

function checkMatching(){
  const i = state.idx;
  const q = QUIZ[i];
  const answers = q.left.map((_, li) => matchState.connections[li]);
  state.answers[i] = answers;
  const correct = isAnswerCorrect(q, answers);
  if (correct) beep('good'); else beep('bad');
  if (correct && !state.xpGiven[i]) {
    state.xpGiven[i] = 'now';
    state.xp += XP_CORRECT;
    updateHeader();
    confetti();
  }
  save();
  renderQuiz();
}

function answerSingle(k){
  const i = state.idx;
  if (state.answers[i] != null) return;
  state.answers[i] = k;
  const correct = k === QUIZ[i].ok;
  if (correct) beep('good'); else beep('bad');
  if (correct && !state.xpGiven[i]) {
    state.xpGiven[i] = 'now';
    state.xp += XP_CORRECT;
    updateHeader();
    confetti();
  }
  save();
  renderQuiz();
}

function answerEmoji(k){
  const i = state.idx;
  if (state.answers[i] != null) return;
  state.answers[i] = k;
  const correct = QUIZ[i].ok.includes(k);
  if (correct) beep('good'); else beep('bad');
  if (correct && !state.xpGiven[i]) {
    state.xpGiven[i] = 'now';
    state.xp += XP_CORRECT;
    updateHeader();
    confetti();
  }
  save();
  setTimeout(() => {
    if (i + 1 < QUIZ.length) state.idx++;
    else state.finished = true;
    save();
    renderQuiz();
  }, 450);
}

function updateHeader(){
  $('#xp').textContent = state.xp;
  $('#soundBtn').textContent = state.muted ? '🔇' : '🔊';
}

$('#soundBtn').onclick = () => { 
  state.muted = !state.muted; 
  save(); 
  updateHeader(); 
  beep('click'); 
};

$('#resetBtn').onclick = () => {
  beep('click');
  if (!confirm('Начать тест заново? Весь прогресс будет удалён.')) return;
  state = defaults();
  try { localStorage.removeItem(KEY); } catch (e) {}
  renderQuiz();
  updateHeader();
};

/* --- Сертификат --- */
function openCert(){
  beep('click');
  const sc = quizScore(), n = QUIZ.length;
  const M = $('#certContent');
  const date = new Date().toLocaleDateString('ru-RU', {day:'numeric', month:'long', year:'numeric'});
  
  M.innerHTML = `<h3>🏅 Твой сертификат</h3>
    <label class="muted" for="certName">Впиши своё имя:</label>
    <input id="certName" maxlength="40" placeholder="Имя и фамилия" value="${esc(state.name || '')}">
    <div class="cert" id="certPrint">
      <div class="ct">СЕРТИФИКАТ</div>
      <div style="margin:8px 0">${MASCOT(70)}</div>
      <p>подтверждает, что</p>
      <div class="name" id="certNameOut">${esc(state.name || '______________')}</div>
      <p>успешно прошёл(-ла) тест <b>«Давай вспомним!»</b><br>по курсу Python Start</p>
      <h2>⭐ ${state.xp} XP</h2>
      <p>Правильных ответов: ${sc} из ${n} · ${date}</p>
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap">
      <button class="btn white" id="certClose">Закрыть</button>
      <button class="btn green" id="certPrintBtn">🖨️ Распечатать</button>
    </div>`;
    
  $('#certName').oninput = e => { state.name = e.target.value; save(); $('#certNameOut').textContent = state.name || '______________'; };
  $('#certPrintBtn').onclick = () => { beep('click'); window.print(); };
  $('#certClose').onclick = () => { beep('click'); $('#certModal').classList.add('hidden'); };
  
  $('#certModal').classList.remove('hidden');
  confetti();
  beep('good');
}

$('#certModal').onclick = e => { if (e.target.id === 'certModal') $('#certModal').classList.add('hidden'); };

updateHeader();
renderQuiz();
</script>
